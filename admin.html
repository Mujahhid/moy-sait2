<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Заявки bio_capybara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: рабочий стол менеджера — сводка сверху, фильтры, список заявок карточками-строками */
:root{
  --bg:#fbfaf7;--surface:#fff;--ink:#2b2119;--muted:#6f6257;--line:#e7e0d6;--orange:#f07f1e;--orange-soft:#fde9d6;
  --new:#e0731b;--called:#3d7fd6;--enrolled:#2f8a57;--rejected:#9a8f86;--danger:#c4472f;
  --display:"Unbounded",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--bg:#181411;--surface:#221c17;--ink:#f3ebe2;--muted:#b3a597;--line:#3a3029;--orange:#ff9a3d;--orange-soft:#3b2716;--new:#ff9a3d;--called:#7fb0f0;--enrolled:#5cc489;--rejected:#8d8278;--danger:#ff8a72;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:1.2rem}
h1{font:700 1.35rem/1.2 var(--display);margin:0}
.top{display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between}
.btn{font:600 .9rem var(--body);border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:.55em 1.1em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{border-color:var(--danger);background:transparent;color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1.2rem}
/* вход */
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:.9rem}
label{display:grid;gap:.3rem;font-weight:600;font-size:.85rem;color:var(--muted)}
input,select,textarea{font:500 1rem var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem;width:100%}
.err{color:var(--danger);font-weight:600;margin:0}
.muted{color:var(--muted)}
/* сводка */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
.stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.8rem 1rem;cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c)}
.stat b{display:block;font:700 1.6rem/1.1 var(--display);color:var(--c);font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.tools input{flex:1 1 220px;width:auto}
/* список */
.list{display:grid;gap:.6rem}
.lead{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:.9rem 1rem;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:.6rem 1rem;align-items:center}
.lead .who{display:grid;gap:.15rem;min-width:0}
.lead .nm{font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.lead .ph{font:500 .95rem var(--mono);color:var(--ink);text-decoration:none;user-select:all}
.lead .meta{font-size:.82rem;color:var(--muted)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.1em .6em;border-radius:999px;background:var(--orange-soft);color:var(--ink);margin-right:.3rem}
.lead select{width:auto;font-size:.9rem;padding:.45rem .6rem;border-color:var(--c)}
.lead .acts{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.lead .acts .btn{padding:.4em .8em;font-size:.82rem}
.lead .note{grid-column:1/-1}
.lead .note textarea{min-height:2.6rem;resize:vertical;font-size:.92rem}
.confirm{grid-column:1/-1;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--danger) 10%,transparent);border-radius:10px;padding:.5rem .7rem}
@media (max-width:700px){.lead{grid-template-columns:1fr}.lead .acts{justify-content:flex-start}}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
html.embed body{padding:14px 16px 20px}
html.embed .login{margin-top:6vh}
</style>
</head>
<body>
<div class="wrap">

  <form class="card login" id="login">
    <h1>Заявки</h1>
    <p class="muted" style="margin:0">Вход для администратора сайта bio_capybara.</p>
    <label for="pw">Пароль<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="login-err" hidden></p>
    <button class="btn" type="submit">Войти</button>
  </form>

  <section id="app" hidden>
    <div class="wrap">
      <div class="top">
        <h1>Заявки на диагностику</h1>
        <div class="tools">
          <span class="muted" id="updated" style="font-size:.85rem"></span>
          <button class="btn ghost" id="refresh" type="button">Обновить</button>
          <button class="btn ghost" id="csv" type="button">Скачать CSV</button>
          <button class="btn ghost" id="logout" type="button">Выйти</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="tools"><input id="q" type="search" placeholder="Поиск по имени или номеру" aria-label="Поиск"></div>
      <div class="list" id="list"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add('embed');
(function(){
  var KEY='bc_admin', token='';
  try{token=sessionStorage.getItem(KEY)||''}catch(e){}
  var STATUS={new:['Новая','var(--new)'],called:['Связались','var(--called)'],enrolled:['Записан','var(--enrolled)'],rejected:['Отказ','var(--rejected)']};
  var leads=[],filter='all',query='';
  var $=function(s){return document.querySelector(s)};
  function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show')},1800)}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmtPhone(p){var d=p.replace(/\D/g,'');return d.length===11?'+7 '+d.slice(1,4)+' '+d.slice(4,7)+'-'+d.slice(7,9)+'-'+d.slice(9):p}
  function fmtDate(iso){var d=new Date(iso);return d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
  function api(method,url,body){
    return fetch(url,{method:method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){
      if(r.status===401){logout('Неверный пароль.');throw new Error('401')}
      if(r.status===503){logout('Пароль администратора ещё не задан на сервере (переменная ADMIN_PASSWORD).');throw new Error('503')}
      if(!r.ok)throw new Error(r.status);return r.json()});
  }
  function logout(msg){token='';try{sessionStorage.removeItem(KEY)}catch(e){}$('#app').hidden=true;$('#login').hidden=false;var e=$('#login-err');if(msg){e.textContent=msg;e.hidden=false}else e.hidden=true}
  function load(quiet){
    return api('GET','/api/admin/leads').then(function(d){leads=d.leads||[];$('#updated').textContent='обновлено в '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});render();if(!quiet)toast('Заявок: '+leads.length)}).catch(function(e){if(e.message!=='401'&&e.message!=='503')toast('Не удалось загрузить заявки')});
  }
  function render(){
    var counts={all:leads.length,new:0,called:0,enrolled:0,rejected:0};leads.forEach(function(l){counts[l.status]=(counts[l.status]||0)+1});
    var tiles=[['all','Все','var(--ink)']].concat(Object.keys(STATUS).map(function(k){return [k,STATUS[k][0],STATUS[k][1]]}));
    $('#stats').innerHTML=tiles.filter(function(t){return t[0]!=='rejected'}).map(function(t){return '<button type="button" class="stat" data-f="'+t[0]+'" aria-pressed="'+(filter===t[0])+'" style="--c:'+t[2]+'"><b>'+counts[t[0]]+'</b><span>'+t[1]+'</span></button>'}).join('');
    $('#stats').querySelectorAll('.stat').forEach(function(b){b.onclick=function(){filter=filter===b.dataset.f?'all':b.dataset.f;render()}});
    var q=query.toLowerCase().replace(/\s/g,''),qd=q.replace(/\D/g,'');
    var rows=leads.filter(function(l){return (filter==='all'||l.status===filter)&&(!q||l.name.toLowerCase().replace(/\s/g,'').indexOf(q)>=0||(qd&&l.phone.indexOf(qd)>=0))});
    if(!rows.length){$('#list').innerHTML='<div class="card empty">'+(leads.length?'Под фильтр ничего не подошло.':'Заявок пока нет. Как только кто-то запишется на диагностику с сайта, заявка появится здесь.')+'</div>';return}
    $('#list').innerHTML=rows.map(function(l){var st=STATUS[l.status]||STATUS.new;return '<article class="lead" data-id="'+l.id+'" style="--c:'+st[1]+'">'+
      '<div class="who"><span class="nm">'+esc(l.name)+'</span><a class="ph" href="tel:'+esc(l.phone)+'">'+fmtPhone(l.phone)+'</a></div>'+
      '<div class="meta"><span class="tag">'+esc(l.exam)+'</span><span class="tag">'+esc(l.who)+'</span><br>'+fmtDate(l.createdAt)+'</div>'+
      '<div class="acts"><select aria-label="Статус">'+Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(k===l.status?' selected':'')+'>'+STATUS[k][0]+'</option>'}).join('')+'</select>'+
      '<button class="btn ghost" type="button" data-copy>Копировать номер</button><button class="btn danger" type="button" data-del>Удалить</button></div>'+
      '<div class="note"><textarea placeholder="Заметка: когда перезвонить, о чём договорились" aria-label="Заметка">'+esc(l.note||'')+'</textarea></div></article>'}).join('');
  }
  $('#list').addEventListener('change',function(e){var art=e.target.closest('.lead');if(!art)return;var id=art.dataset.id;
    if(e.target.tagName==='SELECT'){api('PATCH','/api/admin/leads/'+id,{status:e.target.value}).then(function(d){replace(d.lead);render();toast('Статус: '+STATUS[d.lead.status][0])}).catch(function(){toast('Не сохранилось')})}
    if(e.target.tagName==='TEXTAREA'){api('PATCH','/api/admin/leads/'+id,{note:e.target.value}).then(function(d){replace(d.lead);toast('Заметка сохранена')}).catch(function(){toast('Не сохранилось')})}
  });
  $('#list').addEventListener('click',function(e){var art=e.target.closest('.lead');if(!art)return;var id=art.dataset.id,l=leads.find(function(x){return x.id===id});
    if(e.target.hasAttribute('data-copy')){var t=fmtPhone(l.phone);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Номер скопирован')}).catch(function(){toast(t)})}
    if(e.target.hasAttribute('data-del')){if(art.querySelector('.confirm'))return;var c=document.createElement('div');c.className='confirm';c.innerHTML='<span>Удалить заявку «'+esc(l.name)+'» навсегда?</span><button class="btn danger" type="button" data-yes>Удалить</button><button class="btn ghost" type="button" data-no>Отмена</button>';art.appendChild(c)}
    if(e.target.hasAttribute('data-no'))e.target.closest('.confirm').remove();
    if(e.target.hasAttribute('data-yes')){api('DELETE','/api/admin/leads/'+id).then(function(){leads=leads.filter(function(x){return x.id!==id});render();toast('Заявка удалена')}).catch(function(){toast('Не удалось удалить')})}
  });
  function replace(n){for(var i=0;i<leads.length;i++)if(leads[i].id===n.id)leads[i]=n}
  $('#q').addEventListener('input',function(e){query=e.target.value;render()});
  $('#refresh').onclick=function(){load()};
  $('#logout').onclick=function(){logout()};
  $('#csv').onclick=function(){
    var head=['Дата','Имя','Телефон','Кто','Экзамен','Статус','Заметка'];
    var lines=[head].concat(leads.map(function(l){return [fmtDate(l.createdAt),l.name,fmtPhone(l.phone),l.who,l.exam,(STATUS[l.status]||STATUS.new)[0],l.note||'']}));
    var csv='﻿'+lines.map(function(r){return r.map(function(v){v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='zayavki-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  };
  $('#login').addEventListener('submit',function(e){e.preventDefault();token=$('#pw').value;
    api('GET','/api/admin/leads').then(function(d){try{sessionStorage.setItem(KEY,token)}catch(x){}$('#pw').value='';$('#login').hidden=true;$('#app').hidden=false;leads=d.leads||[];render();$('#updated').textContent='обновлено только что'}).catch(function(){});
  });
  if(token){$('#login').hidden=true;$('#app').hidden=false;load(true)}
  setInterval(function(){if(token&&!document.hidden)load(true)},30000);
})();
</script>
</body>
</html>
